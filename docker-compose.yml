#version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: promptshield-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/promptshield.db:/app/promptshield.db
      - ./backend/trained_models:/app/trained_models

    restart: unless-stopped

    networks:
      - promptshield-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: promptshield-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - promptshield-network


  redis:
    image: redis:7-alpine

    container_name: promptshield-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - promptshield-network


networks:
  promptshield-network:
    driver: bridge

volumes:
  redis_data: